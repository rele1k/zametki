name: Сборка приложения Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Собрать приложение
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) { Write-Error "Zametki.csproj не найден. Загрузите файлы проекта." }
          dotnet publish $proj.FullName -c Release -r win-x64 --self-contained true -o out

      - name: Отдать готовое приложение
        uses: actions/upload-artifact@v4
        with:
          name: Zametki-Windows
          path: out
